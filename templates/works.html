<!DOCTYPE html>
<html>
    <head>
        <meta charset="utf-8">
        <meta name="viewport" content="width=device-width, initial-scale=1">
        <title>Home Page</title>
        <style type="text/css">
            *{
                text-decoration: None;
            }
            body{
                background-color: #BDBDBD;
            }
            .navbar{
                background: black; font-family: 'Times New Roman'; padding-right: 15px; padding-left: 15px; padding-block: 15px; border-radius: 5px;
            }
            .navdiv{
                display: flex; align-items: center; justify-content: space-between;
            }
            .logo{
                font-size: 35px; font-weight: 600; color: white;
            }
            li{
                list-style: None; display: inline-block;
            }
            li a{
                color: gray; font-size: 18px; font-weight: bold; margin-right: 25px;
            }
            .P_Works{ 
                display: flex; justify-content: center; gap: 20px; margin-top: 40px;
            }
            .P_Works li a{
                color: black; text-decoration: underline;
            }
        </style>
    </head>
    <body>
        <nav class="navbar">
            <div class="navdiv">
                <div class="logo">Programming Works</div>
                <ul>
                    <li><a href="/profile">Profile</a></li>
                    <li><a href="/contact">Contact</a></li>
                    <li><a href="/">Home</a></li>

                </ul>
            </div>
        </nav>

        <ul class="P_Works">
            <li>
                <a href="/works/ToUpperCase">ToUpperCase</a><br>
                <img src="{{url_for('static', filename='images/letter.png')}}" alt="Circle Icon" width="110">
            </li>
            <li>
                <a href="/works/area/circle">Area of a Circle</a><br>
                <img src="{{url_for('static', filename='images/circle.png')}}" alt="Circle Icon" width="121">
            </li>
            <li>
                <a href="/works/area/triangle">Area of a Triangle</a><br>
                <img src="{{url_for('static', filename='images/triangle.png')}}" alt="Circle Icon" width="132">
            </li>
            <li>
                <a href="/works/Link-List">Link List</a><br>
                <img src="{{url_for('static', filename='images/list.png')}}" alt="Circle Icon" width="100" style="margin-top: 20px;">
            </li>
        </ul>
    </body>
</html>
