<!DOCTYPE html>
<html>
<head>
    <title>Area of a Circle</title>
    <style type="text/css">
        *{
            text-decoration: None;
        }
        body{
            background-color: #BDBDBD;
        }
        .navbar{
            background: black; font-family: 'Times New Roman'; padding-right: 15px; padding-left: 15px; padding-block: 15px; border-radius: 5px;
        }
        .navdiv{
            display: flex; align-items: center; justify-content: space-between;
        }
        .logo{
            font-size: 35px; font-weight: 600; color: white;
        }
        li{
            list-style: None; display: inline-block;
        }
        li a{
            color: gray; font-size: 18px; font-weight: bold; margin-right: 25px;
        }
        </style>
</head>
<body>
    <nav class="navbar">
        <div class="navdiv">
            <div class="logo">Area of a Circle</div>
            <ul>
                <li><a href="/profile">Profile</a></li>
                <li><a href="/contact">Contact</a></li>
                <li><a href="/">Home</a></li>
            </ul>
        </div>
    </nav>

    <form action="/works/area/circle" method="post">
        <label for="radius">Enter a radius:</label>
        <input type="text" id="radius" name="radius">
        <input type="submit" value="Compute">
    </form>

    {% if result %}
    <p>Area of the circle: {{ result }}</p>
    {% endif %}
</body>
</html>
