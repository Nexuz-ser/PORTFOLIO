<!DOCTYPE html>
<html>
    <head>
        <title>Area of a Triangle</title>
        <meta name="viewport" content="width=device-width, initial-scale=1">
        <style type="text/css">
            *{
                text-decoration: None;
            }
            body{
                background-color: #BDBDBD;
            }
            .navbar{
                background: black; font-family: 'Times New Roman'; padding-right: 15px; padding-left: 15px; padding-block: 15px; border-radius: 5px;
            }
            .navdiv{
                display: flex; align-items: center; justify-content: space-between;
            }
            .logo{
                font-size: 35px; font-weight: 600; color: white;
            }
            li{
                list-style: None; display: inline-block;
            }
            li a{
                color: gray; font-size: 18px; font-weight: bold; margin-right: 25px;
            }
        </style>
    </head>
    <body>
        <nav class="navbar">
            <div class="navdiv">
                <div class="logo">Area of a Triangle</div>
                <ul>
                    <li><a href="/profile">Profile</a></li>
                    <li><a href="/contact">Contact</a></li>
                    <li><a href="/">Home</a></li>
                    <li><a href="/works">Works</a></li>
                </ul>
            </div>
        </nav>

        <div style="padding-top: 20px;">
            <form action="/works/area/triangle" method="post">
                <label for="base">Enter a base:</label>
                <input type="text" id="base" name="base">
                <label for="height">Enter a height</label>
                <input type="text" id="height" name="height">
                <input type="submit" value="Compute">
            </form>

            {% if result %}
            <p>Area of the Triangle: {{ result }}</p>
            {% endif %}
        </div>
    </body>
</html>
